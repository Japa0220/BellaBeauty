<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento | Bella Pink</title>
  <style>
    :root{--pink:#d5377d;--pink-dark:#9f1f57;--text:#2f2031;--border:#f4d0dd;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#ffe9f2 0%,#fff3f8 42%,#fff 100%);color:var(--text);}
    .topbar{background:var(--pink);color:#fff;text-align:center;padding:12px 20px;font-weight:700;}
    .header-wrap{background:#fff;position:sticky;top:0;z-index:12;box-shadow:0 20px 40px rgba(175,46,96,.08);}
    .header-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .logo{font-size:1.5rem;font-weight:800;letter-spacing:.08em;color:var(--pink);}
    .nav-links{display:flex;flex-wrap:wrap;gap:18px;}
    .nav-links a{color:var(--text);text-decoration:none;font-weight:600;}
    .nav-actions a{padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid transparent;background:var(--pink);color:#fff;}
    .page{max-width:1080px;margin:32px auto;padding:0 24px 40px;}
    .card{background:#fff;border:1px solid var(--border);border-radius:32px;padding:28px;box-shadow:0 20px 45px rgba(192,83,132,.1);margin-top:24px;}
    .card h1{margin-top:0;font-size:2.6rem;}
    .method-group{display:grid;gap:18px;margin-top:24px;}
    .method{border:1px solid rgba(213,90,141,.24);border-radius:24px;padding:18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
    .method input{margin-right:14px;transform:scale(1.2);}
    .info{color:#6d516a;line-height:1.7;margin-top:10px;}
    button{border:none;border-radius:999px;padding:16px 28px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 14px 30px rgba(214,62,122,.22);margin-top:24px;}
    .result{background:#fff5f8;border:1px solid rgba(213,90,141,.24);border-radius:22px;padding:20px;color:#4f3145;margin-top:24px;}
    .footer{margin-top:40px;padding:24px;text-align:center;color:#6b4b6f;}
    @media(max-width:820px){.method{flex-direction:column;align-items:flex-start;}}  
  </style>
</head>
<body>
  <div class="topbar">PAGAMENTO | Escolha sua forma de pagamento</div>
  <header class="header-wrap">
    <div class="header-inner">
      <div class="logo">Bella Pink</div>
      <nav class="nav-links">
        <a href="index.html">Produtos</a>
        <a href="carrinho.html">Carrinho</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html">Voltar ao catálogo</a>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="card">
      <h1>Finalizar pagamento</h1>
      <p>Confira os itens do carrinho e escolha o método de pagamento desejado.</p>
      <div id="paymentSummary" class="info"></div>
      <div class="method-group">
        <label class="method"><span><input type="radio" name="paymentMethod" value="pix" checked /> PIX</span><span>Pagamento instantâneo via chave PIX.</span></label>
        <label class="method"><span><input type="radio" name="paymentMethod" value="creditSingle" /></span><span>Crédito à vista.</span></label>
        <label class="method"><span><input type="radio" name="paymentMethod" value="creditParcelled" /></span><span>Crédito parcelado.</span></label>
      </div>
      <div id="paymentHelp" class="info"></div>
      <button id="confirmPaymentBtn" type="button">Confirmar pagamento</button>
      <div id="confirmation" class="result" style="display:none;"></div>
    </div>
  </main>
  <footer class="footer">© Bella Pink • Beleza feminina</footer>
  <script>
    const CART_KEY = 'bellaPinkCart';
    const state = { cart: JSON.parse(localStorage.getItem(CART_KEY) || '[]') };
    function formatPrice(value) { return value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
    function renderSummary() {
      const summary = document.getElementById('paymentSummary');
      if (!state.cart.length) {
        summary.innerHTML = '<strong>Seu carrinho está vazio.</strong> Volte aos produtos para adicionar itens.';
        document.getElementById('confirmPaymentBtn').style.display = 'none';
        return;
      }
      const total = state.cart.reduce((sum, item) => sum + Number(item.price || 0), 0);
      summary.innerHTML = `<strong>Itens:</strong> ${state.cart.length}<br /><strong>Total:</strong> ${formatPrice(total)}`;
      renderHelp();
    }
    function renderHelp() {
      const help = document.getElementById('paymentHelp');
      const selected = document.querySelector('input[name="paymentMethod"]:checked').value;
      if (selected === 'pix') {
        help.innerHTML = 'Use o PIX para pagamento rápido. Chave: 11.111.111/0001-11. Após o comprovante, o pedido será confirmado.';
      } else if (selected === 'creditSingle') {
        help.innerHTML = 'Crédito à vista com parcelamento em 1x. Parcelas sem juros dependendo da administradora.';
      } else {
        help.innerHTML = 'Parcelamento em até 3x sem juros. Valor total será dividido em parcelas iguais.';
      }
    }
    function confirmPayment() {
      if (!state.cart.length) return;
      const method = document.querySelector('input[name="paymentMethod"]:checked').value;
      const total = state.cart.reduce((sum, item) => sum + Number(item.price || 0), 0);
      const details = method === 'pix' ? 'PIX identificado. Use a chave para pagamento.' : method === 'creditSingle' ? 'Pagamento em crédito à vista confirmado.' : 'Pagamento parcelado confirmado.';
      localStorage.removeItem(CART_KEY);
      document.getElementById('confirmation').style.display = 'block';
      document.getElementById('confirmation').innerHTML = `<strong>Pagamento concluído!</strong><br />${details}<br />Total: ${formatPrice(total)}<br />Em breve você receberá a confirmação do pedido.`;
      document.getElementById('confirmPaymentBtn').style.display = 'none';
    }
    document.querySelectorAll('input[name="paymentMethod"]').forEach((input) => input.addEventListener('change', renderHelp));
    document.getElementById('confirmPaymentBtn').addEventListener('click', confirmPayment);
    renderSummary();
  </script>
</body>
</html>
