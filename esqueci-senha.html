<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esqueci a senha | Bella Pink</title>
  <style>
    :root{--pink:#d5377d;--pink-dark:#9f1f57;--text:#2f2031;--border:#f4d0dd;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#ffe9f2 0%,#fff3f8 42%,#fff 100%);color:var(--text);}
    .topbar{background:var(--pink);color:#fff;text-align:center;padding:12px 20px;font-weight:700;}
    .header-wrap{background:#fff;position:sticky;top:0;z-index:12;box-shadow:0 20px 40px rgba(175,46,96,.08);}
    .header-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .logo{font-size:1.4rem;font-weight:800;color:var(--pink);}
    .nav-links{display:flex;flex-wrap:wrap;gap:16px;}
    .nav-links a{color:var(--text);text-decoration:none;font-weight:600;}
    .page{max-width:760px;margin:32px auto;padding:0 24px 40px;}
    .hero{background:#fff;border:1px solid var(--border);border-radius:32px;padding:32px;box-shadow:0 20px 40px rgba(217,60,119,.08);}
    .hero h1{margin:0;font-size:2.6rem;color:var(--text);}
    .hero p{color:#6d516a;line-height:1.8;margin:16px 0 28px;}
    .form-group{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
    label{font-size:.88rem;font-weight:700;color:#69415f;text-transform:uppercase;letter-spacing:.08em;}
    input{border:1px solid rgba(213,90,141,.24);border-radius:20px;padding:16px 18px;font-size:1rem;outline:none;}
    button{border:none;border-radius:999px;padding:16px 28px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 14px 30px rgba(214,62,122,.22);}
    .result{margin-top:20px;padding:18px;border-radius:22px;background:#fff5f8;border:1px solid rgba(213,90,141,.24);color:#5d3750;}
  </style>
</head>
<body>
  <div class="topbar">Recuperar senha</div>
  <header class="header-wrap">
    <div class="header-inner">
      <div class="logo">Bella Pink</div>
      <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="carrinho.html">Carrinho</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <section class="hero">
      <div style="text-transform:uppercase;font-size:.82rem;letter-spacing:.18em;font-weight:800;color:#a94c7f;margin-bottom:18px">Segurança</div>
      <h1>Recuperar senha</h1>
      <p>Informe seu e-mail ou CPF para receber o código de recuperação e redefinir a senha do seu perfil.</p>
      <div class="form-group"><label for="recoverInput">E-mail ou CPF</label><input id="recoverInput" type="text" placeholder="Seu e-mail ou CPF" /></div>
      <button id="recoverBtn" type="button">Enviar recuperação</button>
      <div id="recoverResult" class="result" style="display:none"></div>
    </section>
  </main>
  <script>
    const users = JSON.parse(localStorage.getItem('bellaPinkUsers') || '[]');
    document.getElementById('recoverBtn').addEventListener('click', () => {
      const value = document.getElementById('recoverInput').value.trim();
      const result = document.getElementById('recoverResult');
      const user = users.find((item) => item.email === value.toLowerCase() || item.cpf === value);
      if (!user) {
        result.style.display = 'block';
        result.textContent = 'Nenhum usuário encontrado com esses dados.';
        return;
      }
      const code = String(Math.floor(100000 + Math.random() * 900000));
      user.verificationCode = code;
      user.verified = false;
      localStorage.setItem('bellaPinkUsers', JSON.stringify(users));
      result.style.display = 'block';
      result.innerHTML = `<strong>Código enviado:</strong> ${code}<br />Use este código na área de confirmação do login.`;
    });
  </script>
</body>
</html>
